<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babysitting · Foxerie</title>
<meta name="theme-color" content="#9c3f22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 4 25 19 14 30Z M58 4 39 19 50 30Z M12 20Q32 12 52 20L56 33 32 58 8 33Z' fill='%23d9541e'/%3E%3Cpath d='M8 33 24 37 32 58Z M56 33 40 37 32 58Z' fill='%23fff'/%3E%3Ccircle cx='23' cy='30' r='3' fill='%232a1a12'/%3E%3Ccircle cx='41' cy='30' r='3' fill='%232a1a12'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fox" viewBox="0 0 64 64">
    <path d="M6 4 L25 19 L14 30 Z" fill="currentColor"/>
    <path d="M58 4 L39 19 L50 30 Z" fill="currentColor"/>
    <path d="M12 20 Q32 12 52 20 L56 33 L32 58 L8 33 Z" fill="currentColor"/>
    <path d="M8 33 L24 37 L32 58 Z" fill="#fff"/>
    <path d="M56 33 L40 37 L32 58 Z" fill="#fff"/>
    <circle cx="23" cy="30" r="2.6" fill="#2a1a12"/>
    <circle cx="41" cy="30" r="2.6" fill="#2a1a12"/>
    <path d="M28.5 53 L35.5 53 L32 58 Z" fill="#2a1a12"/>
  </symbol>
</svg>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64" width="40" height="40"><use href="#fox"/></svg></span>
      <div><h1>Foxerie</h1><p class="addr">Babysitting</p></div>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="view">
    <div class="view-head">
      <h2>Bonsoir Nephelie</h2>
      <p class="sub">À la fin de la garde, indique l'heure d'arrivée et de départ. Le total du mois se met à jour tout seul.</p>
    </div>
    <form class="card baby-form" id="baby-form" autocomplete="off">
      <div class="row2">
        <label>Date<input type="date" id="bf-date" required></label>
        <label>Code<input type="password" id="bf-code" required inputmode="numeric" placeholder="Code donné par Louise ou Quentin"></label>
        <label>Arrivée<input type="time" id="bf-arrivee" required step="300"></label>
        <label>Départ<input type="time" id="bf-depart" required step="300"></label>
      </div>
      <label>Remarque (facultatif)<input type="text" id="bf-note" maxlength="200" placeholder="Ex. dîner fait, coucher à 21 h"></label>
      <button type="submit" class="btn primary big">Déclarer la garde</button>
      <p class="note" id="bf-msg" aria-live="polite"></p>
    </form>
    <div id="baby-body"></div>
  </section>
</main>
<script src="babysitting.js?v=15"></script>
</body>
</html>
